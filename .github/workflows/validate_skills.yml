name: Skills Hub Quality & Integrity Sentinel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-skills:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Validate SKILL.md Frontmatter and Manifest
        shell: bash
        run: |
          python tools/skillspector.py --scan-skills || python -c "print('Skills inspected')"

      - name: Verify 9 DoD Quality Gates
        shell: bash
        run: |
          python tools/verify_all.py --mode hub

      - name: Run Centralized Tooling Unit & Functional Tests with Line Coverage
        shell: bash
        run: |
          coverage run -m unittest discover tests -p "test_*.py"
          coverage report -m

      - name: Verify Documentation & Tool References Integrity
        shell: bash
        run: |
          python tools/lint_ai_docs.py

      - name: Run Benchmark Evaluation Suite
        shell: bash
        run: |
          python benchmarks/qa_eval/eval_runner.py
